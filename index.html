<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roselia Song Championship</title>
  <style>
    :root {
      --bg:#111218;
      --panel:#1b1d26;
      --panel2:#232632;
      --text:#f4f5f8;
      --muted:#aeb3c2;
      --line:#343849;
      --accent:#6d74ff;
      --danger:#ff6b7a;
      --ok:#55d68b;
      --shadow:0 10px 30px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#0e0f14 0%,#151720 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans JP",sans-serif;
    }
    button{font:inherit}
    .app{max-width:1180px;margin:0 auto;padding:26px 18px 56px}
    header{display:flex;gap:16px;align-items:end;justify-content:space-between;margin-bottom:22px}
    h1{margin:0;font-size:clamp(26px,4vw,42px)}
    .subtitle{color:var(--muted);margin-top:6px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      border:1px solid var(--line); background:var(--panel2); color:var(--text);
      border-radius:12px; padding:10px 14px; cursor:pointer;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.primary{background:var(--accent);border-color:transparent}
    .btn.danger{background:transparent;border-color:#6e3941;color:#ffadb6}
    .btn:disabled{opacity:.42;cursor:not-allowed}
    .status{
      background:var(--panel);border:1px solid var(--line);border-radius:16px;
      padding:14px 16px;margin-bottom:18px;display:flex;gap:18px;flex-wrap:wrap;
      align-items:center;box-shadow:var(--shadow)
    }
    .status strong{font-size:18px}
    .status .muted{color:var(--muted)}
    .group-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .card{
      position:relative;background:var(--panel);border:2px solid transparent;border-radius:18px;
      overflow:hidden;box-shadow:var(--shadow);transition:.15s ease;cursor:pointer;
    }
    .card:hover{transform:translateY(-2px)}
    .card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(109,116,255,.22),var(--shadow)}
    .image-wrap{aspect-ratio:1/1;background:#0d0e13;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .image-wrap img{width:100%;height:100%;object-fit:cover;display:block}
    .image-missing{color:var(--muted);font-size:13px;padding:20px;text-align:center}
    .card-body{padding:12px}
    .song-title{font-weight:800;line-height:1.35;min-height:2.7em}
    .artist{font-size:12px;color:var(--muted);margin-top:4px}
    .youtube-slot{
      margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:9px 10px;
      color:var(--muted);font-size:12px;text-align:center
    }
    .select-badge{
      position:absolute;top:10px;right:10px;background:rgba(17,18,24,.88);border:1px solid var(--line);
      border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700
    }
    .card.selected .select-badge{background:var(--accent);border-color:transparent}
    .panel{
      background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)
    }
    .panel h2{margin:0 0 8px}
    .panel p{color:var(--muted);margin:0 0 14px}
    .group-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
    .progress{color:var(--muted)}
    .duel{
      display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center
    }
    .vs{font-size:24px;font-weight:900;color:var(--muted)}
    .duel .card{max-width:430px;width:100%;justify-self:center}
    .round-list{display:grid;gap:10px;margin-top:16px}
    .round-item{
      display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--panel2);
      border-radius:10px;color:var(--muted)
    }
    .winner{
      text-align:center;padding:26px 8px
    }
    .winner img{width:min(360px,80vw);aspect-ratio:1/1;object-fit:cover;border-radius:22px;box-shadow:var(--shadow)}
    .winner h2{font-size:34px;margin:18px 0 4px}
    .hidden{display:none!important}
    .warning{color:#ffd37d}
    @media (max-width:850px){
      .group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .duel{grid-template-columns:1fr}
      .vs{text-align:center}
    }
    @media (max-width:520px){
      .app{padding-left:12px;padding-right:12px}
      header{align-items:flex-start;flex-direction:column}
      .group-grid{grid-template-columns:1fr 1fr;gap:9px}
      .card-body{padding:9px}
      .song-title{font-size:14px}
    }

    .section-title{margin:28px 0 12px;font-size:24px}
    .bracket-scroll{overflow-x:auto;padding:6px 2px 18px}
    .bracket{
      display:flex;gap:24px;align-items:stretch;min-width:max-content;
    }
    .bracket-round{
      width:235px;display:flex;flex-direction:column;justify-content:space-around;gap:14px;
    }
    .bracket-round-title{
      text-align:center;font-weight:900;color:var(--muted);margin-bottom:8px;position:sticky;top:0;
    }
    .bracket-match{
      background:var(--panel2);border:1px solid var(--line);border-radius:12px;
      overflow:hidden;min-height:78px;position:relative;
    }
    .bracket-song{
      padding:9px 11px;color:#8f95a6;border-left:3px solid transparent;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .bracket-song + .bracket-song{border-top:1px solid var(--line)}
    .bracket-song.winner{
      color:#fff;font-weight:900;border-left:5px solid #fff;background:rgba(255,255,255,.08);
      text-shadow:0 0 10px rgba(255,255,255,.22);
    }
    .bracket-song.champion{
      color:#fff;font-weight:950;border-left:6px solid var(--ok);
      background:rgba(85,214,139,.12);
    }
    .bracket-connector{
      color:#f7f8fb;font-weight:900;
    }
    .stats-wrap{overflow-x:auto}
    .stats-table{width:100%;border-collapse:collapse;min-width:760px}
    .stats-table th,.stats-table td{
      border-bottom:1px solid var(--line);padding:10px 9px;text-align:center;
    }
    .stats-table th{color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--panel)}
    .stats-table td.title-cell{text-align:left;font-weight:750;max-width:260px}
    .stats-table tr:hover td{background:rgba(255,255,255,.025)}
    .stat-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 18px}
    .stat-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
    .stat-card .n{font-size:24px;font-weight:900}
    .stat-card .k{font-size:12px;color:var(--muted);margin-top:2px}
    @media (max-width:700px){
      .stat-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Roselia Song Championship</h1>
      <div class="subtitle">예선 4중 2선택 → 패자부활 → 조별리그 4중 2선택 → 고정 결선 대진표</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="resetBtn">처음부터</button>
    </div>
  </header>

  <div class="status" id="statusBox">
    <strong id="stageLabel">데이터 로딩 중…</strong>
    <span class="muted" id="statusText"></span>
  </div>

  <main id="main"></main>
</div>

<script>
const CONFIG = {
  picksPerGroup: 2,
  groupSize: 4,
  songsUrl: "songs.json",
  storageKey: "roselia-song-championship-state-v3",
  statsKey: "roselia-song-championship-stats-v1"
};

let songs = [];
let state = null;

const $ = s => document.querySelector(s);
const main = $("#main");
const stageLabel = $("#stageLabel");
const statusText = $("#statusText");

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function save(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); }
function clearSave(){ localStorage.removeItem(CONFIG.storageKey); }
function songById(id){ return songs.find(s => String(s.id)===String(id)); }

function escapeHtml(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* images are directly under /images */
function webImagePath(path){
  if(!path) return "";
  let p=String(path).replaceAll("\\","/");
  p=p.replace(/^\.?\//,"");
  p=p.replace(/^images\/songs\//i,"images/");
  if(!p.startsWith("images/")){
    const name=p.split("/").pop();
    p="images/"+name;
  }
  return p;
}

function imgTag(song){
  const image=webImagePath(song.image);
  if(!image) return `<div class="image-missing">이미지 없음</div>`;
  return `<img src="${escapeHtml(image)}" alt="${escapeHtml(song.title)}"
    onerror="this.outerHTML='<div class=&quot;image-missing&quot;>이미지를 찾을 수 없음<br>${escapeHtml(image)}</div>'">`;
}

function youtubeSlot(song){
  return `<div class="youtube-slot">YouTube 클라이맥스 영역</div>`;
}

function card(song, selected=false, clickable=true, extra=""){
  return `
    <article class="card ${selected?'selected':''}" ${clickable?'':'style="cursor:default"'} ${extra}>
      <div class="image-wrap">${imgTag(song)}</div>
      <div class="select-badge">${selected?'선택됨':'선택'}</div>
      <div class="card-body">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="artist">${escapeHtml(song.artist || "Roselia")}</div>
        ${youtubeSlot(song)}
      </div>
    </article>`;
}

function highestPowerOfTwoLE(n){
  if(n < 1) return 0;
  return 2 ** Math.floor(Math.log2(n));
}

function nextPowerOfTwoGE(n){
  if(n <= 1) return 1;
  return 2 ** Math.ceil(Math.log2(n));
}

function makeGroups(ids){
  const groups=[];
  for(let i=0;i<ids.length;i+=CONFIG.groupSize){
    groups.push(ids.slice(i,i+CONFIG.groupSize));
  }
  return groups;
}

function initializeNew(){
  if(songs.length < 4){
    state={stage:"error",message:"최소 4곡이 필요합니다."};
    render(); return;
  }

  const entrants=shuffle(songs).map(s=>s.id);
  state={
    version:3,
    stage:"prelim",
    entrants,
    prelim:{
      groups:makeGroups(entrants),
      groupIndex:0,
      picks:{},
      passed:[],
      lost:[]
    },
    repechage:null,
    groupStage:null,
    tournament:null,
    champion:null,
    completedAt:null
  };
  save();
  render();
}

function render(){
  if(!state){ initializeNew(); return; }
  if(state.stage==="error"){ renderError(); return; }
  if(state.stage==="prelim"){ renderPrelim(); return; }
  if(state.stage==="repechage"){ renderRepechage(); return; }
  if(state.stage==="groups"){ renderGroups(); return; }
  if(state.stage==="tournament"){ renderTournament(); return; }
  if(state.stage==="winner"){ renderWinner(); return; }
}

function renderError(){
  stageLabel.textContent="오류";
  statusText.textContent=state.message || "";
  main.innerHTML=`<section class="panel"><h2>시작할 수 없음</h2><p>${escapeHtml(state.message||"")}</p></section>`;
}

/* ---------------- PRELIM ---------------- */

function prelimRequired(group){
  return group.length === 4 ? 2 : Math.min(2, group.length);
}

function renderPrelim(){
  const p=state.prelim;
  const idx=p.groupIndex;
  const group=p.groups[idx];
  const key=String(idx);
  const picks=p.picks[key] || [];
  const isRemainder = group.length < 4;
  const maxPick = prelimRequired(group);
  const label=isRemainder ? "자투리조" : `${idx+1}조`;

  stageLabel.textContent=`예선 ${label}`;
  statusText.textContent=isRemainder
    ? `${songs.length}곡 · 남은 ${group.length}곡 중 최대 ${maxPick}곡 선택`
    : `${idx+1} / ${p.groups.length}조 · 4곡 중 2곡 선택`;

  main.innerHTML=`
    <section class="panel">
      <h2>예선 ${label}</h2>
      <p>${isRemainder
        ? `4곡씩 나누고 남은 곡입니다. 최대 ${maxPick}곡까지 고를 수 있습니다. 0곡 선택도 가능합니다.`
        : `4곡 중 다음 단계에 올릴 2곡을 선택하세요.`}</p>
      <div class="group-grid">
        ${group.map(id=>card(songById(id),picks.includes(id),true,`data-prelim-id="${escapeHtml(id)}"`)).join("")}
      </div>
      <div class="group-footer">
        <div class="progress">선택 ${picks.length} / ${isRemainder ? `최대 ${maxPick}` : "2"}</div>
        <button class="btn primary" id="nextPrelimBtn"
          ${(!isRemainder && picks.length!==2) ? "disabled" : ""}>
          ${idx===p.groups.length-1 ? "예선 종료" : "다음 조"}
        </button>
      </div>
    </section>`;

  document.querySelectorAll("[data-prelim-id]").forEach(el=>{
    el.addEventListener("click",()=>{
      const id=el.dataset.prelimId;
      let cur=[...(p.picks[key]||[])];
      const pos=cur.map(String).indexOf(String(id));
      if(pos>=0) cur.splice(pos,1);
      else if(cur.length < maxPick){
        const originalId=group.find(x=>String(x)===String(id));
        cur.push(originalId);
      }
      p.picks[key]=cur;
      save(); renderPrelim();
    });
  });

  $("#nextPrelimBtn").addEventListener("click",()=>{
    if(!isRemainder && picks.length!==2) return;
    if(idx < p.groups.length-1){
      p.groupIndex++;
      save(); renderPrelim();
    }else finishPrelim();
  });
}

function finishPrelim(){
  const p=state.prelim;
  const passed=[], lost=[];
  p.groups.forEach((group,i)=>{
    const picked=p.picks[String(i)] || [];
    passed.push(...picked);
    group.forEach(id=>{
      if(!picked.map(String).includes(String(id))) lost.push(id);
    });
  });
  p.passed=passed;
  p.lost=lost;

  let target=nextPowerOfTwoGE(passed.length);
  if(target > songs.length) target=highestPowerOfTwoLE(songs.length);
  const need=Math.max(0,target-passed.length);

  if(need===0){ startGroupStage(passed); return; }

  if(need>lost.length){
    state={stage:"error",message:`패자부활 후보가 부족합니다. 필요 ${need}곡 / 패자 ${lost.length}곡`};
    save(); render(); return;
  }

  state.stage="repechage";
  state.repechage={candidates:shuffle(lost),need,target,picks:[]};
  save(); renderRepechage();
}

/* ---------------- REPECHAGE ---------------- */

function renderRepechage(){
  const r=state.repechage;
  stageLabel.textContent="패자부활전";
  statusText.textContent=`예선 통과 ${state.prelim.passed.length}곡 + 구제 ${r.need}곡 = ${r.target}곡`;

  main.innerHTML=`
    <section class="panel">
      <h2>패자부활전</h2>
      <p>예선 탈락곡을 전부 모았습니다. 여기서 <b>${r.need}곡</b>을 골라 ${r.target}곡으로 맞추세요.</p>
      <div class="group-grid">
        ${r.candidates.map(id=>card(songById(id),r.picks.includes(id),true,`data-rep-id="${escapeHtml(id)}"`)).join("")}
      </div>
      <div class="group-footer">
        <div class="progress">선택 ${r.picks.length} / ${r.need}</div>
        <button class="btn primary" id="finishRepBtn" ${r.picks.length===r.need ? "" : "disabled"}>조별리그로</button>
      </div>
    </section>`;

  document.querySelectorAll("[data-rep-id]").forEach(el=>{
    el.addEventListener("click",()=>{
      const id=el.dataset.repId;
      let cur=[...r.picks];
      const pos=cur.map(String).indexOf(String(id));
      if(pos>=0) cur.splice(pos,1);
      else if(cur.length<r.need){
        const originalId=r.candidates.find(x=>String(x)===String(id));
        cur.push(originalId);
      }
      r.picks=cur;
      save(); renderRepechage();
    });
  });

  $("#finishRepBtn").addEventListener("click",()=>{
    if(r.picks.length!==r.need) return;
    startGroupStage([...state.prelim.passed,...r.picks]);
  });
}

/* ---------------- GROUP STAGE ---------------- */

function startGroupStage(ids){
  if(ids.length % 4 !== 0){
    state={stage:"error",message:`조별리그 진출곡 ${ids.length}곡이 4의 배수가 아닙니다.`};
    save(); render(); return;
  }
  const shuffled=shuffle(ids);
  state.stage="groups";
  state.groupStage={
    entrants:shuffled,
    groups:makeGroups(shuffled),
    groupIndex:0,
    picks:{},
    qualified:[]
  };
  save(); renderGroups();
}

function renderGroups(){
  const g=state.groupStage;
  const idx=g.groupIndex;
  const group=g.groups[idx];
  const key=String(idx);
  const picks=g.picks[key] || [];

  stageLabel.textContent=`조별리그 ${idx+1}조`;
  statusText.textContent=`${idx+1} / ${g.groups.length}조 · 4곡 중 2곡 선택`;

  main.innerHTML=`
    <section class="panel">
      <h2>조별리그 ${idx+1}조</h2>
      <p>순위는 없습니다. 결선에 올릴 2곡을 선택하세요.</p>
      <div class="group-grid">
        ${group.map(id=>card(songById(id),picks.includes(id),true,`data-group-id="${escapeHtml(id)}"`)).join("")}
      </div>
      <div class="group-footer">
        <div class="progress">선택 ${picks.length} / 2</div>
        <button class="btn primary" id="nextGroupBtn" ${picks.length===2 ? "" : "disabled"}>
          ${idx===g.groups.length-1 ? "조별리그 종료" : "다음 조"}
        </button>
      </div>
    </section>`;

  document.querySelectorAll("[data-group-id]").forEach(el=>{
    el.addEventListener("click",()=>{
      const id=el.dataset.groupId;
      let cur=[...(g.picks[key]||[])];
      const pos=cur.map(String).indexOf(String(id));
      if(pos>=0) cur.splice(pos,1);
      else if(cur.length<2){
        const originalId=group.find(x=>String(x)===String(id));
        cur.push(originalId);
      }
      g.picks[key]=cur;
      save(); renderGroups();
    });
  });

  $("#nextGroupBtn").addEventListener("click",()=>{
    const cur=g.picks[key] || [];
    if(cur.length!==2) return;
    if(idx<g.groups.length-1){
      g.groupIndex++;
      save(); renderGroups();
    }else{
      const qualified=[];
      for(let i=0;i<g.groups.length;i++) qualified.push(...(g.picks[String(i)]||[]));
      g.qualified=qualified;
      startTournament(qualified);
    }
  });
}

/* ---------------- FIXED TOURNAMENT BRACKET ----------------
   Shuffle ONCE here. Every later round follows the fixed bracket positions.
*/

function startTournament(ids){
  const seeded=shuffle(ids); // exactly one shuffle for the entire knockout bracket
  const firstMatches=[];
  for(let i=0;i<seeded.length;i+=2){
    firstMatches.push({
      a:seeded[i],
      b:seeded[i+1] ?? null,
      winner:seeded[i+1] == null ? seeded[i] : null
    });
  }

  state.stage="tournament";
  state.tournament={
    initialSize:ids.length,
    seeded,
    rounds:[
      {size:ids.length,matches:firstMatches}
    ],
    roundIndex:0,
    matchIndex:0
  };
  save();
  advanceAutomaticByes();
  renderTournament();
}

function buildNextRoundIfReady(){
  const t=state.tournament;
  const current=t.rounds[t.roundIndex];
  if(!current.matches.every(m=>m.winner!=null)) return false;

  const winners=current.matches.map(m=>m.winner);
  if(winners.length===1){
    finishTournament(winners[0]);
    return true;
  }

  if(t.rounds.length > t.roundIndex+1){
    t.roundIndex++;
    t.matchIndex=0;
    return true;
  }

  const nextMatches=[];
  for(let i=0;i<winners.length;i+=2){
    nextMatches.push({
      a:winners[i],
      b:winners[i+1] ?? null,
      winner:winners[i+1] == null ? winners[i] : null
    });
  }
  t.rounds.push({size:winners.length,matches:nextMatches});
  t.roundIndex++;
  t.matchIndex=0;
  return true;
}

function advanceAutomaticByes(){
  const t=state.tournament;
  let safety=20;
  while(safety-->0){
    const round=t.rounds[t.roundIndex];
    const nextUnplayed=round.matches.findIndex(m=>m.winner==null);
    if(nextUnplayed>=0){
      t.matchIndex=nextUnplayed;
      save();
      return;
    }
    if(!buildNextRoundIfReady()) return;
    if(state.stage==="winner") return;
  }
}

function renderTournament(){
  const t=state.tournament;
  const round=t.rounds[t.roundIndex];
  const pair=round.matches[t.matchIndex];

  if(!pair || pair.winner!=null){
    advanceAutomaticByes();
    if(state.stage==="winner"){ renderWinner(); return; }
  }

  const active=t.rounds[t.roundIndex].matches[t.matchIndex];
  const a=songById(active.a), b=songById(active.b);

  stageLabel.textContent=`결선 토너먼트 ${round.size}강`;
  statusText.textContent=`대결 ${t.matchIndex+1} / ${round.matches.length} · 대진표 고정`;

  main.innerHTML=`
    <section class="panel">
      <h2>${round.size}강</h2>
      <p>결선 진입 시 한 번 셔플된 대진표를 끝까지 유지합니다.</p>
      <div class="duel">
        ${card(a,false,true,`data-win-id="${escapeHtml(a.id)}"`)}
        <div class="vs">VS</div>
        ${card(b,false,true,`data-win-id="${escapeHtml(b.id)}"`)}
      </div>
    </section>`;

  document.querySelectorAll("[data-win-id]").forEach(el=>{
    el.addEventListener("click",()=>{
      const id=el.dataset.winId;
      active.winner=[active.a,active.b].find(x=>String(x)===String(id));
      save();

      const next=t.rounds[t.roundIndex].matches.findIndex((m,i)=>i>t.matchIndex && m.winner==null);
      if(next>=0){
        t.matchIndex=next;
        save(); renderTournament();
      }else{
        buildNextRoundIfReady();
        if(state.stage==="winner") renderWinner();
        else { advanceAutomaticByes(); renderTournament(); }
      }
    });
  });
}

function finishTournament(championId){
  state.stage="winner";
  state.champion=championId;
  state.completedAt=new Date().toISOString();
  recordStatistics();
  save();
}

/* ---------------- BRACKET ---------------- */

function roundName(size){
  if(size===2) return "결승";
  if(size===4) return "4강";
  return `${size}강`;
}

function bracketHTML(){
  const t=state.tournament;
  if(!t || !t.rounds) return "";

  return `
    <h2 class="section-title">최종 대진표</h2>
    <div class="bracket-scroll">
      <div class="bracket">
        ${t.rounds.map((round,ri)=>`
          <div class="bracket-round">
            <div class="bracket-round-title">${roundName(round.size)}</div>
            ${round.matches.map(m=>{
              const a=songById(m.a), b=m.b!=null?songById(m.b):null;
              const aWin=String(m.winner)===String(m.a);
              const bWin=b && String(m.winner)===String(m.b);
              const champ=String(m.winner)===String(state.champion);
              return `
                <div class="bracket-match">
                  <div class="bracket-song ${aWin?'winner':''} ${aWin&&champ?'champion':''}">
                    ${escapeHtml(a?.title ?? "BYE")}
                  </div>
                  <div class="bracket-song ${bWin?'winner':''} ${bWin&&champ?'champion':''}">
                    ${escapeHtml(b?.title ?? "BYE")}
                  </div>
                </div>`;
            }).join("")}
          </div>
        `).join("")}
      </div>
    </div>`;
}

/* ---------------- STATISTICS ---------------- */

function loadStats(){
  try{
    const x=JSON.parse(localStorage.getItem(CONFIG.statsKey)||'{"runs":0,"songs":{}}');
    if(!x.songs) x.songs={};
    if(!x.runs) x.runs=0;
    return x;
  }catch(e){
    return {runs:0,songs:{}};
  }
}

function ensureStat(stats,id){
  const key=String(id);
  if(!stats.songs[key]){
    const s=songById(id);
    stats.songs[key]={
      id,
      title:s?.title ?? key,
      prelimAppearances:0,
      prelimPassed:0,
      repechageSelected:0,
      groupAppearances:0,
      groupPassed:0,
      knockoutAppearances:0,
      knockoutWins:0,
      finals:0,
      championships:0
    };
  }
  return stats.songs[key];
}

function recordStatistics(){
  if(state.statsRecorded) return;

  const stats=loadStats();
  stats.runs++;

  // Every entrant appeared in prelim.
  state.entrants.forEach(id=>ensureStat(stats,id).prelimAppearances++);

  (state.prelim?.passed||[]).forEach(id=>ensureStat(stats,id).prelimPassed++);
  (state.repechage?.picks||[]).forEach(id=>ensureStat(stats,id).repechageSelected++);

  (state.groupStage?.entrants||[]).forEach(id=>ensureStat(stats,id).groupAppearances++);
  (state.groupStage?.qualified||[]).forEach(id=>ensureStat(stats,id).groupPassed++);

  const rounds=state.tournament?.rounds||[];
  rounds.forEach(round=>{
    round.matches.forEach(m=>{
      if(m.a!=null) ensureStat(stats,m.a).knockoutAppearances++;
      if(m.b!=null) ensureStat(stats,m.b).knockoutAppearances++;
      if(m.winner!=null) ensureStat(stats,m.winner).knockoutWins++;
    });
  });

  const finalRound=rounds[rounds.length-1];
  if(finalRound?.matches?.[0]){
    const f=finalRound.matches[0];
    if(f.a!=null) ensureStat(stats,f.a).finals++;
    if(f.b!=null) ensureStat(stats,f.b).finals++;
  }
  if(state.champion!=null) ensureStat(stats,state.champion).championships++;

  localStorage.setItem(CONFIG.statsKey,JSON.stringify(stats));
  state.statsRecorded=true;
}

function runStatsHTML(){
  const stats=loadStats();
  const rows=Object.values(stats.songs)
    .sort((a,b)=>
      b.championships-a.championships ||
      b.knockoutWins-a.knockoutWins ||
      b.groupPassed-a.groupPassed ||
      String(a.title).localeCompare(String(b.title))
    );

  const champ=rows[0];
  const totalKO=rows.reduce((n,r)=>n+r.knockoutWins,0);

  return `
    <h2 class="section-title">누적 통계</h2>
    <section class="panel">
      <div class="stat-cards">
        <div class="stat-card"><div class="n">${stats.runs}</div><div class="k">완료한 대회</div></div>
        <div class="stat-card"><div class="n">${rows.length}</div><div class="k">통계 기록 곡</div></div>
        <div class="stat-card"><div class="n">${totalKO}</div><div class="k">결선 승리 누계</div></div>
        <div class="stat-card"><div class="n">${escapeHtml(champ?.title ?? "-")}</div><div class="k">최다 우승곡</div></div>
      </div>
      <div class="stats-wrap">
        <table class="stats-table">
          <thead><tr>
            <th>곡</th>
            <th>예선 통과</th>
            <th>패자부활</th>
            <th>조별 통과</th>
            <th>결선 승</th>
            <th>결승</th>
            <th>우승</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr>
                <td class="title-cell">${escapeHtml(r.title)}</td>
                <td>${r.prelimPassed}/${r.prelimAppearances}</td>
                <td>${r.repechageSelected}</td>
                <td>${r.groupPassed}/${r.groupAppearances}</td>
                <td>${r.knockoutWins}</td>
                <td>${r.finals}</td>
                <td><b>${r.championships}</b></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </section>`;
}

/* ---------------- WINNER ---------------- */

function renderWinner(){
  const s=songById(state.champion);
  stageLabel.textContent="우승";
  statusText.textContent="대회 완료 · 대진표 및 누적 통계";
  main.innerHTML=`
    <section class="panel winner">
      <div class="image-wrap" style="max-width:360px;margin:0 auto;border-radius:22px">${imgTag(s)}</div>
      <h2>${escapeHtml(s.title)}</h2>
      <div class="artist">${escapeHtml(s.artist || "Roselia")}</div>
      ${youtubeSlot(s)}
      <div style="margin-top:20px">
        <button class="btn primary" id="againBtn">새 대회 시작</button>
      </div>
    </section>
    ${bracketHTML()}
    ${runStatsHTML()}
  `;
  $("#againBtn").addEventListener("click",()=>{ clearSave(); initializeNew(); });
}

$("#resetBtn").addEventListener("click",()=>{
  if(confirm("현재 진행 상황을 지우고 처음부터 다시 시작할까요?")){
    clearSave(); initializeNew();
  }
});

async function boot(){
  try{
    const res=await fetch(CONFIG.songsUrl,{cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    songs=await res.json();
    if(!Array.isArray(songs)) throw new Error("songs.json must be an array");

    const saved=localStorage.getItem(CONFIG.storageKey);
    if(saved){
      try{ state=JSON.parse(saved); }catch(e){ state=null; }
    }
    render();
  }catch(err){
    stageLabel.textContent="songs.json 로드 실패";
    statusText.textContent=err.message;
    main.innerHTML=`
      <section class="panel">
        <h2>데이터를 읽지 못했습니다.</h2>
        <p>index.html과 같은 위치에 <b>songs.json</b>이 있는지 확인하세요.</p>
      </section>`;
  }
}

boot();
</script>
