<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- v29 pure click-to-play YouTube iframe experiment -->
  <title>Roselia Song Championship</title>
  <style>
    :root {
      --bg:#111218;
      --panel:#1b1d26;
      --panel2:#232632;
      --text:#f4f5f8;
      --muted:#aeb3c2;
      --line:#343849;
      --accent:#6d74ff;
      --danger:#ff6b7a;
      --ok:#55d68b;
      --shadow:0 10px 30px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#0e0f14 0%,#151720 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans JP",sans-serif;
    }
    button{font:inherit}
    .app{max-width:1180px;margin:0 auto;padding:26px 18px 56px}
    header{display:flex;gap:16px;align-items:end;justify-content:space-between;margin-bottom:22px}
    h1{margin:0;font-size:clamp(26px,4vw,42px)}
    .subtitle{color:var(--muted);margin-top:6px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .btn{
      border:1px solid var(--line); background:var(--panel2); color:var(--text);
      border-radius:12px; padding:10px 14px; cursor:pointer;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.primary{background:var(--accent);border-color:transparent}
    .btn.danger{background:transparent;border-color:#6e3941;color:#ffadb6}
    .btn:disabled{opacity:.42;cursor:not-allowed}
    .status{
      background:var(--panel);border:1px solid var(--line);border-radius:16px;
      padding:14px 16px;margin-bottom:18px;display:flex;gap:18px;flex-wrap:wrap;
      align-items:center;box-shadow:var(--shadow)
    }
    .status strong{font-size:18px}
    .status .muted{color:var(--muted)}
    .group-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .card{
      position:relative;background:var(--panel);border:2px solid transparent;border-radius:18px;
      overflow:hidden;box-shadow:var(--shadow);transition:.15s ease;cursor:pointer;
    }
    .card:hover{transform:translateY(-2px)}
    .card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(109,116,255,.22),var(--shadow)}
    .image-wrap{aspect-ratio:1/1;background:#0d0e13;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .image-wrap img{width:100%;height:100%;object-fit:cover;display:block}
    .image-missing{color:var(--muted);font-size:13px;padding:20px;text-align:center}
    .card-body{padding:12px}
    .song-title{font-weight:800;line-height:1.35;min-height:2.7em}
    .artist{font-size:12px;color:var(--muted);margin-top:4px}
    .youtube-slot{
      margin-top:10px;
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      background:#0d0e13;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }
    .youtube-slot iframe{
      display:block;
      width:100%;
      aspect-ratio:16/9;
      border:0;
      background:#000;
    }
    .youtube-missing{
      padding:9px 10px;
      color:var(--muted);
    }

    .select-badge{
      position:absolute;top:10px;right:10px;background:rgba(17,18,24,.88);border:1px solid var(--line);
      border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700
    }
    .card.selected .select-badge{background:var(--accent);border-color:transparent}
    .panel{
      background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)
    }
    .panel h2{margin:0 0 8px}
    .panel p{color:var(--muted);margin:0 0 14px}
    .group-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
    .progress{color:var(--muted)}
    .duel{
      display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center
    }
    .vs{font-size:24px;font-weight:900;color:var(--muted)}
    .duel .card{max-width:430px;width:100%;justify-self:center}
    .round-list{display:grid;gap:10px;margin-top:16px}
    .round-item{
      display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--panel2);
      border-radius:10px;color:var(--muted)
    }
    .winner{
      text-align:center;padding:26px 8px
    }
    .winner img{width:min(360px,80vw);aspect-ratio:1/1;object-fit:cover;border-radius:22px;box-shadow:var(--shadow)}
    .winner h2{font-size:34px;margin:18px 0 4px}
    .hidden{display:none!important}
    .warning{color:#ffd37d}
    @media (max-width:850px){
      .group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .duel{grid-template-columns:1fr}
      .vs{text-align:center}
    }
    @media (max-width:520px){
      .app{padding-left:12px;padding-right:12px}
      header{align-items:flex-start;flex-direction:column}
      .group-grid{grid-template-columns:1fr 1fr;gap:9px}
      .card-body{padding:9px}
      .song-title{font-size:14px}
    }

    .section-title{margin:28px 0 12px;font-size:24px}
    .bracket-scroll{overflow-x:auto;padding:6px 2px 18px}
    .bracket{
      display:flex;gap:24px;align-items:stretch;min-width:max-content;
    }
    .bracket-round{
      width:235px;display:flex;flex-direction:column;justify-content:space-around;gap:14px;
    }
    .bracket-round-title{
      text-align:center;font-weight:900;color:var(--muted);margin-bottom:8px;position:sticky;top:0;
    }
    .bracket-match{
      background:var(--panel2);border:1px solid var(--line);border-radius:12px;
      overflow:hidden;min-height:78px;position:relative;
    }
    .bracket-song{
      padding:9px 11px;color:#8f95a6;border-left:3px solid transparent;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .bracket-song + .bracket-song{border-top:1px solid var(--line)}
    .bracket-song.winner{
      color:#fff;font-weight:900;border-left:5px solid #fff;background:rgba(255,255,255,.08);
      text-shadow:0 0 10px rgba(255,255,255,.22);
    }
    .bracket-song.champion{
      color:#fff;font-weight:950;border-left:6px solid var(--ok);
      background:rgba(85,214,139,.12);
    }
    .bracket-connector{
      color:#f7f8fb;font-weight:900;
    }
    .stats-wrap{overflow-x:auto}
    .stats-table{width:100%;border-collapse:collapse;min-width:760px}
    .stats-table th,.stats-table td{
      border-bottom:1px solid var(--line);padding:10px 9px;text-align:center;
    }
    .stats-table th{color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--panel)}
    .stats-table td.title-cell{text-align:left;font-weight:750;max-width:260px}
    .stats-table tr:hover td{background:rgba(255,255,255,.025)}
    .stat-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 18px}
    .stat-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
    .stat-card .n{font-size:24px;font-weight:900}
    .stat-card .k{font-size:12px;color:var(--muted);margin-top:2px}
    @media (max-width:700px){
      .stat-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

  
    /* ---- compact knockout UI ---- */
    .knockout-panel{
      max-width:760px;
      margin:0 auto;
      padding:14px;
    }
    .knockout-duel{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
      gap:10px;
      align-items:center;
    }
    .knockout-duel .card{
      max-width:280px;
      width:100%;
      justify-self:center;
    }
    .knockout-duel .image-wrap{
      max-height:240px;
    }
    .knockout-duel .card-body{padding:9px}
    .knockout-duel .song-title{
      min-height:auto;
      font-size:15px;
      line-height:1.25;
    }
    .knockout-duel .artist{font-size:11px}
    .knockout-duel .youtube-slot{
      padding:6px 8px;
      margin-top:7px;
      font-size:11px;
    }


    /* aggregate statistics */
    .stats-panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      box-shadow:var(--shadow);
    }
    .stats-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .stats-head h2{margin:0}
    .stats-head .muted{font-size:12px;color:var(--muted)}
    .stats-table{
      display:grid;
      gap:6px;
    }
    .stats-row{
      display:grid;
      grid-template-columns:46px minmax(0,1fr) 72px 72px 72px;
      gap:8px;
      align-items:center;
      min-width:0;
      padding:7px 8px;
      border:1px solid var(--line);
      border-radius:11px;
      background:var(--panel2);
    }
    .stats-row.header{
      background:transparent;
      border:0;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      padding-top:0;
      padding-bottom:2px;
    }
    .stats-rank{
      position:absolute;
      left:-9999px;
    }
    .stats-jacket{
      width:42px;
      height:42px;
      border-radius:7px;
      object-fit:cover;
      display:block;
      background:#0d0e13;
    }
    .stats-song{
      min-width:0;
      font-weight:800;
      font-size:13px;
      line-height:1.2;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .stats-num{
      text-align:right;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      font-size:13px;
    }
    .stats-row.header .stats-num{text-align:right}
    .stats-empty{
      padding:28px 12px;
      text-align:center;
      color:var(--muted);
    }
    .stats-actions{
      display:flex;
      justify-content:center;
      margin-top:14px;
    }
    @media (max-width:700px){
      .stats-panel{padding:8px}
      .stats-row{
        grid-template-columns:38px minmax(0,1fr) 54px 54px 54px;
        gap:5px;
        padding:6px 5px;
      }
      .stats-jacket{width:34px;height:34px;border-radius:6px}
      .stats-song{font-size:11px}
      .stats-num{font-size:11px}
      .stats-row.header{font-size:9px}
      .stats-head{align-items:center;margin-bottom:8px}
      .stats-head h2{font-size:18px}
    }

    /* winner flying to center */
    .winner-fly{
      position:fixed;
      z-index:9999;
      object-fit:cover;
      border-radius:18px;
      pointer-events:none;
      box-shadow:0 18px 55px rgba(0,0,0,.6);
      transition:
        left .90s cubic-bezier(.16,.84,.24,1),
        top .90s cubic-bezier(.16,.84,.24,1),
        width .90s cubic-bezier(.16,.84,.24,1),
        height .90s cubic-bezier(.16,.84,.24,1),
        opacity .26s ease .86s,
        transform .90s cubic-bezier(.16,.84,.24,1);
    }

    /* round transition interstitial */
    .round-transition{
      min-height:55vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      gap:16px;
    }
    .round-transition .round-kicker{
      color:var(--muted);
      font-size:14px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .round-transition .round-name{
      font-size:clamp(42px,9vw,86px);
      line-height:1;
      font-weight:950;
      margin:0;
    }
    .round-transition .btn{
      min-width:180px;
      font-size:17px;
      padding:13px 18px;
    }

    /* Vertical tournament bracket inspired by World Cup schedule */
    .vertical-bracket{
      max-width:900px;
      margin:0 auto;
      padding:8px 0 20px;
    }
    .vb-title{
      text-align:center;
      font-size:26px;
      font-weight:950;
      margin:10px 0 18px;
    }
    .vb-half{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .vb-half.bottom{
      flex-direction:column-reverse;
    }
    .vb-stage{
      display:grid;
      gap:8px;
      position:relative;
    }
    .vb-stage-label{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      margin:2px 0;
    }
    .vb-match-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);
      align-items:center;
      gap:8px;
    }
    .vb-team{
      background:var(--panel2);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px 10px;
      min-height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#858b9b;
      font-size:13px;
      line-height:1.2;
    }
    .vb-team.win{
      color:#fff;
      font-weight:900;
      border:2px solid rgba(255,255,255,.92);
      background:rgba(255,255,255,.075);
      box-shadow:0 0 13px rgba(255,255,255,.08);
    }
    .vb-team.champ{
      border:2px solid var(--ok);
      background:rgba(85,214,139,.13);
      color:#fff;
      font-weight:950;
    }
    .vb-vs{
      text-align:center;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
    }
    .vb-link{
      width:2px;
      height:16px;
      margin:-2px auto;
      background:var(--line);
    }
    .vb-link.bright{
      width:3px;
      background:#f4f5f8;
      box-shadow:0 0 8px rgba(255,255,255,.4);
    }
    .vb-center{
      margin:16px auto;
      max-width:420px;
      position:relative;
    }
    .vb-final-label{
      text-align:center;
      font-weight:950;
      font-size:24px;
      margin-bottom:8px;
    }
    .vb-final{
      display:grid;
      grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);
      gap:8px;
      align-items:center;
    }
    .vb-cup{
      text-align:center;
      font-size:28px;
      line-height:1;
    }

    @media (max-width:700px){
      .knockout-panel{padding:10px}
      .knockout-duel{
        grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);
        gap:6px;
      }
      .knockout-duel .card{
        max-width:none;
      }
      .knockout-duel .image-wrap{
        max-height:none;
        aspect-ratio:1/1;
      }
      .knockout-duel .card-body{padding:7px}
      .knockout-duel .song-title{font-size:12px}
      .knockout-duel .artist{display:none}
      .knockout-duel .youtube-slot{
        font-size:10px;
        padding:5px;
        margin-top:5px;
      }
      .knockout-duel .select-badge{
        top:6px;right:6px;padding:4px 6px;font-size:10px;
      }
      .knockout-duel .vs{font-size:17px}
      .vb-team{font-size:11px;padding:7px 6px}
      .vb-match-row{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:5px}
      .vb-final{grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr)}
    }

  
    /* ---- v6 bracket override: cards only at first round, highlight paths not cards ---- */
    .vertical-bracket{
      max-width:900px;
      margin:0 auto;
      padding:8px 0 24px;
    }
    .vb-half{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .vb-half.bottom{
      flex-direction:column-reverse;
    }
    .vb-first-stage{
      display:grid;
      gap:8px;
    }
    .vb-first-match{
      display:grid;
      grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr);
      align-items:center;
      gap:8px;
    }
    .vb-team{
      background:var(--panel2);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px 10px;
      min-height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--text);
      font-size:13px;
      line-height:1.2;
      font-weight:700;
    }
    .vb-team.win,
    .vb-team.champ{
      /* winner is NOT emphasized by card brightness anymore */
      color:var(--text);
      font-weight:700;
      border:1px solid var(--line);
      background:var(--panel2);
      box-shadow:none;
    }
    .vb-vs{
      text-align:center;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
    }
    .vb-path-stage{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0;
    }
    .vb-path-stage-label{
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      margin:1px 0 3px;
    }
    .vb-node{
      width:14px;
      height:14px;
      border-radius:50%;
      border:2px solid #555b6b;
      background:var(--panel);
      position:relative;
      z-index:2;
    }
    .vb-node.win{
      border-color:#fff;
      background:#fff;
      box-shadow:0 0 10px rgba(255,255,255,.55);
    }
    .vb-line{
      width:2px;
      height:20px;
      background:#454b5c;
      margin:-1px auto;
      border-radius:999px;
    }
    .vb-line.win{
      width:5px;
      background:#fff;
      box-shadow:0 0 10px rgba(255,255,255,.55);
    }
    .vb-branch{
      width:72%;
      max-width:460px;
      height:28px;
      margin:0 auto;
      position:relative;
    }
    .vb-branch::before,
    .vb-branch::after{
      content:"";
      position:absolute;
      top:0;
      width:50%;
      height:100%;
      border-top:2px solid #454b5c;
    }
    .vb-branch::before{
      left:0;
      border-right:2px solid #454b5c;
      border-top-right-radius:10px;
    }
    .vb-branch::after{
      right:0;
      border-left:2px solid #454b5c;
      border-top-left-radius:10px;
    }
    .vb-branch.win-left::before,
    .vb-branch.win-right::after{
      border-color:#fff;
      border-width:5px;
      box-shadow:0 -3px 8px rgba(255,255,255,.24);
    }
    .vb-center{
      margin:18px auto;
      max-width:420px;
      text-align:center;
    }
    .vb-final-label{
      text-align:center;
      font-weight:950;
      font-size:24px;
      margin-bottom:6px;
    }
    .vb-final-node{
      width:18px;
      height:18px;
      margin:0 auto 8px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 14px rgba(255,255,255,.65);
    }
    .vb-champion{
      display:inline-block;
      margin-top:8px;
      background:var(--panel2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 18px;
      font-weight:950;
      font-size:18px;
    }
    @media (max-width:700px){
      .vb-team{font-size:11px;padding:7px 6px}
      .vb-first-match{
        grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);
        gap:5px;
      }
      .vb-branch{width:88%}
    }

  
    /* ---- v7: MusicCup-inspired SVG result bracket ---- */
    .mc-bracket-panel{
      background:#0c0d13;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
      padding:12px 6px 18px;
    }
    .mc-bracket-head{
      text-align:center;
      margin:4px 0 8px;
    }
    .mc-bracket-head .eyebrow{
      color:#7e73ff;
      font-size:13px;
      font-weight:900;
      letter-spacing:.09em;
    }
    .mc-bracket-head h3{
      margin:4px 0 0;
      font-size:22px;
    }
    .mc-svg-wrap{
      width:100%;
      overflow:hidden;
    }
    .mc-svg{
      width:100%;
      height:auto;
      display:block;
      min-height:620px;
    }
    .mc-path{
      fill:none;
      stroke:#303442;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .mc-path.win{
      stroke:#d991ff;
      stroke-width:5.5;
      filter:url(#winnerGlow);
    }
    .mc-entry{
      fill:#171923;
      stroke:#3d4251;
      stroke-width:1.5;
    }
    .mc-entry-title{
      fill:#e8eaf1;
      font-weight:800;
      font-size:13px;
      dominant-baseline:middle;
    }
    .mc-entry-thumb{
      rx:5;
      ry:5;
    }
    .mc-round-label{
      fill:#747b8e;
      font-size:11px;
      font-weight:800;
      text-anchor:middle;
    }
    .mc-champ-box{
      fill:#171923;
      stroke:#bd63f4;
      stroke-width:2.2;
      filter:url(#softGlow);
    }
    .mc-champ-title{
      fill:#fff;
      font-size:20px;
      font-weight:950;
      text-anchor:middle;
    }
    .mc-champ-sub{
      fill:#d991ff;
      font-size:11px;
      font-weight:900;
      text-anchor:middle;
    }
    .mc-champ-img{
      clip-path:url(#champClip);
    }
    @media(max-width:700px){

    /* ---- v8 bracket card/layout/export overrides ---- */

<body>
<div class="app">
  <header>
    <div>
      <h1>Roselia Song Championship</h1>
      <div class="subtitle">예선 → 패자부활 → 조별리그 → 16강 고정 대진표</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="undoBtn" disabled>되돌리기</button>
      <button class="btn" id="resetBtn">처음부터</button>
    </div>
  </header>

  <div class="status" id="statusBox">
    <strong id="stageLabel">데이터 로딩 중…</strong>
    <span class="muted" id="statusText"></span>
  </div>
<main id="main"></main>
</div>

<script>
const CONFIG = {
  picksPerGroup: 2,
  groupSize: 4,
  songsUrl: "songs.json",
  storageKey: "roselia-song-championship-state-v5",
  historyKey: "roselia-song-championship-history-v5",
  statsKey: "roselia-song-championship-stats-v3"
};

const SUPABASE = {
  url: "https://onndrhyaymjazvnbqbgz.supabase.co",
  key: "sb_publishable_HqLemyPBgX1HVAgbBeTkZQ_lPwLhLj2"
};
let supabaseSubmitting = false;

let songs=[];
let state=null;
let undoStack=[];

const $=s=>document.querySelector(s);
const main=$("#main");
const stageLabel=$("#stageLabel");
const statusText=$("#statusText");

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function deepClone(x){ return JSON.parse(JSON.stringify(x)); }
function save(){
  localStorage.setItem(CONFIG.storageKey,JSON.stringify(state));
  localStorage.setItem(CONFIG.historyKey,JSON.stringify(undoStack.slice(-80)));
  updateUndoButton();
}
function clearSave(){
  localStorage.removeItem(CONFIG.storageKey);
  localStorage.removeItem(CONFIG.historyKey);
  undoStack=[];
  updateUndoButton();
}
function pushUndo(){
  if(!state) return;
  undoStack.push(deepClone(state));
  if(undoStack.length>80) undoStack.shift();
  save();
}
function undo(){
  if(!undoStack.length) return;
  state=undoStack.pop();
  save();
  render();
}
function updateUndoButton(){
  const b=$("#undoBtn");
  if(b) b.disabled=!undoStack.length;
}
function songById(id){ return songs.find(s=>String(s.id)===String(id)); }
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function webImagePath(path){
  if(!path) return "";
  let p=String(path).replaceAll("\\","/");
  p=p.replace(/^\.?\//,"");
  p=p.replace(/^images\/songs\//i,"images/");
  if(!p.startsWith("images/")) p="images/"+p.split("/").pop();
  return p;
}
function imgTag(song){
  const image=webImagePath(song?.image);
  if(!image) return `<div class="image-missing">이미지 없음</div>`;
  return `<img src="${escapeHtml(image)}" alt="${escapeHtml(song?.title||"")}"
    onerror="this.outerHTML='<div class=&quot;image-missing&quot;>이미지 없음</div>'">`;
}
function youtubeStartSeconds(value){
  if(value===null || value===undefined || value==="") return 0;
  if(typeof value==="number" && Number.isFinite(value)) return Math.max(0,Math.floor(value));
  const s=String(value).trim();
  if(/^\d+$/.test(s)) return Math.max(0,parseInt(s,10));
  const m=s.match(/^(\d+):(\d{1,2})$/);
  if(m) return Math.max(0,parseInt(m[1],10)*60+parseInt(m[2],10));
  return 0;
}
function youtubeSlot(song){
  const id=String(song?.youtubeId||"").trim();
  if(!id){
    return `<div class="youtube-slot"><div class="youtube-missing">YouTube 없음</div></div>`;
  }

  const start=youtubeStartSeconds(song?.youtubeStart);
  const origin=encodeURIComponent(location.origin);

  // Pure click-to-play embed:
  // - no autoplay
  // - no loadVideoById / playVideo / seekTo
  // - user clicks YouTube's own play button
  const src=
    `https://www.youtube.com/embed/${encodeURIComponent(id)}`+
    `?start=${start}`+
    `&loop=1`+
    `&iv_load_policy=3`+
    `&enablejsapi=1`+
    `&origin=${origin}`;

  return `<div class="youtube-slot" onclick="event.stopPropagation()">
    <iframe
      src="${src}"
      title="${escapeHtml(song?.title||"")} YouTube 클라이맥스"
      loading="eager"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>`;
}

function stopYoutubePlayer(){}

function stopYoutubePlayers(){
  // Pure embeds are removed automatically when the current round/card DOM is replaced.
}
function card(song,selected=false,extra=""){
  return `
    <article class="card ${selected?'selected':''}" ${extra}>
      <div class="image-wrap">${imgTag(song)}</div>
      <div class="select-badge">${selected?'선택됨':'선택'}</div>
      <div class="card-body">
        <div class="song-title">${escapeHtml(song?.title||"")}</div>
        <div class="artist">${escapeHtml(song?.artist||"Roselia")}</div>
        ${youtubeSlot(song)}
      </div>
    </article>`;
}
function makeGroups(ids){
  const groups=[];
  for(let i=0;i<ids.length;i+=CONFIG.groupSize) groups.push(ids.slice(i,i+CONFIG.groupSize));
  return groups;
}
function nextPowerOfTwoGE(n){
  if(n<=1) return 1;
  return 2**Math.ceil(Math.log2(n));
}
function highestPowerOfTwoLE(n){
  if(n<1) return 0;
  return 2**Math.floor(Math.log2(n));
}
function roundName(size){
  if(size===2) return "결승";
  if(size===4) return "4강";
  return `${size}강`;
}

/* ---------- NEW RUN ---------- */
function initializeNew(){
  if(songs.length<4){
    state={stage:"error",message:"최소 4곡이 필요합니다."};
    render();return;
  }
  undoStack=[];
  const entrants=shuffle(songs).map(s=>s.id);
  state={
    stage:"prelim",
    entrants,
    prelim:{groups:makeGroups(entrants),groupIndex:0,picks:{},passed:[],lost:[]},
    repechage:null,
    groupStage:null,
    tournament:null,
    champion:null,
    completedAt:null,
    statsRecorded:false,
    supabaseRecorded:false
  };
  save();render();
}
function render(){
  updateUndoButton();
  if(!state){initializeNew();return;}
  if(state.stage==="error"){renderError();return;}
  if(state.stage==="prelim"){renderPrelim();return;}
  if(state.stage==="repechage"){renderRepechage();return;}
  if(state.stage==="groups"){renderGroups();return;}
  if(state.stage==="roundIntro"){renderRoundIntro();return;}
  if(state.stage==="tournament"){renderTournament();return;}
  if(state.stage==="winner"){renderWinner();return;}
}
function renderError(){
  stageLabel.textContent="오류";
  statusText.textContent=state.message||"";
  main.innerHTML=`<section class="panel"><h2>시작할 수 없음</h2><p>${escapeHtml(state.message||"")}</p></section>`;
}

/* ---------- PRELIM ---------- */
function renderPrelim(){
  const p=state.prelim,idx=p.groupIndex,group=p.groups[idx],key=String(idx);
  const picks=p.picks[key]||[];
  const remainder=group.length<4;
  const maxPick=remainder?Math.min(2,group.length):2;
  const label=remainder?"자투리조":`${idx+1}조`;
  stageLabel.textContent=`예선 ${label}`;
  statusText.textContent=remainder
    ? `남은 ${group.length}곡 중 최대 ${maxPick}곡 선택`
    : `${idx+1}/${p.groups.length}조 · 4곡 중 2곡 선택`;

  main.innerHTML=`
    <section class="panel">
      <h2>예선 ${label}</h2>
      <p>${remainder?`남은 곡 중 최대 ${maxPick}곡을 선택하세요.`:"4곡 중 2곡을 선택하세요."}</p>
      <div class="group-grid">
        ${group.map(id=>card(songById(id),picks.map(String).includes(String(id)),`data-prelim-id="${escapeHtml(id)}"`)).join("")}
      </div>
      <div class="group-footer">
        <div class="progress">선택 ${picks.length} / ${remainder?`최대 ${maxPick}`:"2"}</div>
        <button class="btn primary" id="nextPrelimBtn" ${(!remainder&&picks.length!==2)?"disabled":""}>
          ${idx===p.groups.length-1?"예선 종료":"다음 조"}
        </button>
      </div>
    </section>`;

  document.querySelectorAll("[data-prelim-id]").forEach(el=>el.addEventListener("click",()=>{
    pushUndo();
    const id=el.dataset.prelimId;
    let cur=[...(p.picks[key]||[])];
    const pos=cur.map(String).indexOf(String(id));
    if(pos>=0) cur.splice(pos,1);
    else if(cur.length<maxPick) cur.push(group.find(x=>String(x)===String(id)));
    p.picks[key]=cur;save();renderPrelim();
  }));

  $("#nextPrelimBtn").addEventListener("click",()=>{
    if(!remainder&&picks.length!==2)return;
    pushUndo();
    if(idx<p.groups.length-1){p.groupIndex++;save();renderPrelim();}
    else finishPrelim();
  });
}
function finishPrelim(){
  const p=state.prelim,passed=[],lost=[];
  p.groups.forEach((group,i)=>{
    const picked=p.picks[String(i)]||[];
    passed.push(...picked);
    group.forEach(id=>{
      if(!picked.map(String).includes(String(id))) lost.push(id);
    });
  });
  p.passed=passed;p.lost=lost;
  let target=nextPowerOfTwoGE(passed.length);
  if(target>songs.length) target=highestPowerOfTwoLE(songs.length);
  const need=Math.max(0,target-passed.length);
  if(need===0){startGroupStage(passed);return;}
  state.stage="repechage";
  state.repechage={candidates:shuffle(lost),need,target,picks:[]};
  save();renderRepechage();
}

/* ---------- REPECHAGE ---------- */
function renderRepechage(){
  const r=state.repechage;
  stageLabel.textContent="패자부활전";
  statusText.textContent=`${r.need}곡 구제 → ${r.target}곡`;
  main.innerHTML=`
    <section class="panel">
      <h2>패자부활전</h2>
      <p>예선 탈락곡 전체 중 <b>${r.need}곡</b>을 선택하세요.</p>
      <div class="group-grid">
        ${r.candidates.map(id=>card(songById(id),r.picks.map(String).includes(String(id)),`data-rep-id="${escapeHtml(id)}"`)).join("")}
      </div>
      <div class="group-footer">
        <div class="progress">선택 ${r.picks.length}/${r.need}</div>
        <button class="btn primary" id="finishRepBtn" ${r.picks.length===r.need?"":"disabled"}>조별리그로</button>
      </div>
    </section>`;
  document.querySelectorAll("[data-rep-id]").forEach(el=>el.addEventListener("click",()=>{
    pushUndo();
    const id=el.dataset.repId;
    let cur=[...r.picks];
    const pos=cur.map(String).indexOf(String(id));
    if(pos>=0)cur.splice(pos,1);
    else if(cur.length<r.need)cur.push(r.candidates.find(x=>String(x)===String(id)));
    r.picks=cur;save();renderRepechage();
  }));
  $("#finishRepBtn").addEventListener("click",()=>{
    if(r.picks.length!==r.need)return;
    pushUndo();
    startGroupStage([...state.prelim.passed,...r.picks]);
  });
}

/* ---------- GROUP STAGE ---------- */
function startGroupStage(ids){
  if(ids.length%4!==0){
    state={stage:"error",message:`조별리그 진출곡 ${ids.length}곡이 4의 배수가 아닙니다.`};
    save();render();return;
  }
  const shuffled=shuffle(ids);
  state.stage="groups";
  state.groupStage={entrants:shuffled,groups:makeGroups(shuffled),groupIndex:0,picks:{},qualified:[]};
  save();renderGroups();
}
function renderGroups(){
  const g=state.groupStage,idx=g.groupIndex,group=g.groups[idx],key=String(idx);
  const picks=g.picks[key]||[];
  stageLabel.textContent=`조별리그 ${idx+1}조`;
  statusText.textContent=`${idx+1}/${g.groups.length}조 · 4곡 중 2곡`;
  main.innerHTML=`
    <section class="panel">
      <h2>조별리그 ${idx+1}조</h2>
      <p>순위 없이 결선에 올릴 2곡을 선택하세요.</p>
      <div class="group-grid">
        ${group.map(id=>card(songById(id),picks.map(String).includes(String(id)),`data-group-id="${escapeHtml(id)}"`)).join("")}
      </div>
      <div class="group-footer">
        <div class="progress">선택 ${picks.length}/2</div>
        <button class="btn primary" id="nextGroupBtn" ${picks.length===2?"":"disabled"}>
          ${idx===g.groups.length-1?"조별리그 종료":"다음 조"}
        </button>
      </div>
    </section>`;
  document.querySelectorAll("[data-group-id]").forEach(el=>el.addEventListener("click",()=>{
    pushUndo();
    const id=el.dataset.groupId;
    let cur=[...(g.picks[key]||[])];
    const pos=cur.map(String).indexOf(String(id));
    if(pos>=0)cur.splice(pos,1);
    else if(cur.length<2)cur.push(group.find(x=>String(x)===String(id)));
    g.picks[key]=cur;save();renderGroups();
  }));
  $("#nextGroupBtn").addEventListener("click",()=>{
    const cur=g.picks[key]||[];
    if(cur.length!==2)return;
    pushUndo();
    if(idx<g.groups.length-1){g.groupIndex++;save();renderGroups();}
    else{
      const qualified=[];
      for(let i=0;i<g.groups.length;i++)qualified.push(...(g.picks[String(i)]||[]));
      g.qualified=qualified;
      prepareTournament(qualified);
    }
  });
}

/* ---------- FIXED BRACKET ---------- */
function prepareTournament(ids){
  const seeded=shuffle(ids); // one and only shuffle
  const matches=[];
  for(let i=0;i<seeded.length;i+=2){
    matches.push({a:seeded[i],b:seeded[i+1]??null,winner:seeded[i+1]==null?seeded[i]:null});
  }
  state.tournament={
    initialSize:ids.length,
    seeded,
    rounds:[{size:ids.length,matches}],
    roundIndex:0,
    matchIndex:0
  };
  state.stage="roundIntro";
  save();renderRoundIntro();
}

function renderRoundIntro(){
  const t=state.tournament;
  const round=t.rounds[t.roundIndex];
  stageLabel.textContent="결선 토너먼트";
  statusText.textContent="고정 대진표";
  main.innerHTML=`
    <section class="panel round-transition">
      <div class="round-kicker">Knockout Stage</div>
      <h2 class="round-name">${roundName(round.size)}</h2>
      <button class="btn primary" id="enterRoundBtn">${roundName(round.size)} 시작</button>
    </section>`;
  $("#enterRoundBtn").addEventListener("click",()=>{
    pushUndo();
    state.stage="tournament";
    advanceByesAndFindMatch();
    save();render();
  });
}

function currentRound(){
  return state.tournament.rounds[state.tournament.roundIndex];
}
function advanceByesAndFindMatch(){
  const t=state.tournament;
  const round=currentRound();
  const next=round.matches.findIndex(m=>m.winner==null);
  if(next>=0){t.matchIndex=next;return;}
  makeNextRoundOrFinish();
}
function makeNextRoundOrFinish(){
  const t=state.tournament,round=currentRound();
  if(!round.matches.every(m=>m.winner!=null))return;
  const winners=round.matches.map(m=>m.winner);
  if(winners.length===1){
    finishTournament(winners[0]);return;
  }
  const matches=[];
  for(let i=0;i<winners.length;i+=2){
    matches.push({a:winners[i],b:winners[i+1]??null,winner:winners[i+1]==null?winners[i]:null});
  }
  t.rounds.push({size:winners.length,matches});
  t.roundIndex++;
  t.matchIndex=0;
  state.stage="roundIntro";
  save();
}
function animateWinnerToCenter(cardEl,callback){
  const img=cardEl.querySelector("img");
  if(!img){setTimeout(callback,120);return;}

  const r=img.getBoundingClientRect();
  const clone=img.cloneNode(true);
  clone.className="winner-fly";
  Object.assign(clone.style,{
    left:r.left+"px",
    top:r.top+"px",
    width:r.width+"px",
    height:r.height+"px",
    transform:"scale(1)",
    opacity:"1"
  });
  document.body.appendChild(clone);

  requestAnimationFrame(()=>{
    // On phones, almost fill the landscape width; on desktop keep it dramatic but bounded.
    const size=Math.min(window.innerWidth*0.88, window.innerHeight*0.72, 620);
    clone.style.left=((window.innerWidth-size)/2)+"px";
    clone.style.top=((window.innerHeight-size)/2)+"px";
    clone.style.width=size+"px";
    clone.style.height=size+"px";
    clone.style.transform="scale(1.02)";
  });

  // Hold briefly at the center, then fade.
  setTimeout(()=>{ clone.style.opacity="0"; },980);
  setTimeout(()=>{
    clone.remove();
    callback();
  },1220);
}
function renderTournament(){
  const t=state.tournament,round=currentRound();
  const match=round.matches[t.matchIndex];
  if(!match||match.winner!=null){advanceByesAndFindMatch();save();render();return;}

  stageLabel.textContent=`결선 토너먼트 ${roundName(round.size)}`;
  statusText.textContent=`대결 ${t.matchIndex+1}/${round.matches.length} · 대진표 고정`;
  const a=songById(match.a),b=songById(match.b);
  main.innerHTML=`
    <section class="panel knockout-panel">
      <h2>${roundName(round.size)}</h2>
      <p>승자를 선택하세요.</p>
      <div class="knockout-duel">
        ${card(a,false,`data-win-id="${escapeHtml(a.id)}"`)}
        <div class="vs">VS</div>
        ${card(b,false,`data-win-id="${escapeHtml(b.id)}"`)}
      </div>
    </section>`;

  document.querySelectorAll("[data-win-id]").forEach(el=>el.addEventListener("click",()=>{
    if(el.dataset.locked==="1")return;
    document.querySelectorAll("[data-win-id]").forEach(x=>x.dataset.locked="1");
    pushUndo();
    const id=el.dataset.winId;
    match.winner=[match.a,match.b].find(x=>String(x)===String(id));

    animateWinnerToCenter(el,()=>{
      const next=round.matches.findIndex((m,i)=>i>t.matchIndex&&m.winner==null);
      if(next>=0){
        t.matchIndex=next;
        save();renderTournament();
      }else{
        makeNextRoundOrFinish();
        save();render();
      }
    });
  }));
}


/* ---------- SUPABASE GLOBAL STATS ---------- */
function supabaseHeaders(extra={}){
  return {
    "apikey": SUPABASE.key,
    "Authorization": `Bearer ${SUPABASE.key}`,
    ...extra
  };
}

function knockoutStageIds(){
  const rounds=state.tournament?.rounds||[];
  const semifinalRound=rounds.find(r=>Number(r.size)===4);
  const finalRound=rounds.find(r=>Number(r.size)===2) || rounds[rounds.length-1];

  const semifinalists=[];
  if(semifinalRound){
    semifinalRound.matches.forEach(m=>{
      if(m.a!=null)semifinalists.push(String(m.a));
      if(m.b!=null)semifinalists.push(String(m.b));
    });
  }

  const finalists=[];
  const f=finalRound?.matches?.[0];
  if(f){
    if(f.a!=null)finalists.push(String(f.a));
    if(f.b!=null)finalists.push(String(f.b));
  }

  return {
    champion:String(state.champion),
    finalists:[...new Set(finalists)],
    semifinalists:[...new Set(semifinalists)]
  };
}

async function submitSupabaseResult(){
  if(!state || state.stage!=="winner" || state.champion==null)return false;
  if(state.supabaseRecorded || supabaseSubmitting)return true;

  const payload=knockoutStageIds();
  if(payload.finalists.length!==2 || payload.semifinalists.length!==4){
    console.warn("Supabase result not sent: invalid knockout data",payload);
    return false;
  }

  supabaseSubmitting=true;
  try{
    const res=await fetch(`${SUPABASE.url}/rest/v1/worldcup_results`,{
      method:"POST",
      headers:supabaseHeaders({
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      }),
      body:JSON.stringify(payload)
    });

    if(!res.ok){
      const msg=await res.text();
      throw new Error(`Supabase INSERT ${res.status}: ${msg}`);
    }

    state.supabaseRecorded=true;
    save();
    return true;
  }catch(err){
    console.error("Supabase result upload failed:",err);
    return false;
  }finally{
    supabaseSubmitting=false;
  }
}

async function fetchAllSupabaseResults(){
  const all=[];
  const pageSize=1000;
  let from=0;

  while(true){
    const to=from+pageSize-1;
    const res=await fetch(
      `${SUPABASE.url}/rest/v1/worldcup_results?select=champion,finalists,semifinalists&order=id.asc`,
      {
        headers:supabaseHeaders({
          "Range":`${from}-${to}`,
          "Range-Unit":"items"
        })
      }
    );

    if(!res.ok){
      const msg=await res.text();
      throw new Error(`Supabase SELECT ${res.status}: ${msg}`);
    }

    const rows=await res.json();
    all.push(...rows);

    if(rows.length<pageSize)break;
    from+=pageSize;
  }

  return all;
}

function aggregateSupabaseResults(results){
  const stats={runs:results.length,songs:{}};

  function ensure(id){
    const k=String(id);
    if(!stats.songs[k]){
      stats.songs[k]={championships:0,finals:0,semifinals:0};
    }
    return stats.songs[k];
  }

  results.forEach(r=>{
    if(r.champion!=null)ensure(r.champion).championships++;

    (Array.isArray(r.finalists)?r.finalists:[]).forEach(id=>{
      if(id!=null)ensure(id).finals++;
    });

    (Array.isArray(r.semifinalists)?r.semifinalists:[]).forEach(id=>{
      if(id!=null)ensure(id).semifinals++;
    });
  });

  return stats;
}

/* ---------- STATS ---------- */
function loadStats(){
  try{
    const x=JSON.parse(localStorage.getItem(CONFIG.statsKey)||'{"runs":0,"songs":{}}');
    if(!x.songs)x.songs={};
    return x;
  }catch(e){return {runs:0,songs:{}};}
}
function ensureStat(stats,id){
  const k=String(id);
  if(!stats.songs[k]){
    const s=songById(id);
    stats.songs[k]={id,title:s?.title??k,championships:0,finals:0,semifinals:0,knockoutWins:0};
  }
  if(stats.songs[k].championships==null)stats.songs[k].championships=0;
  if(stats.songs[k].finals==null)stats.songs[k].finals=0;
  if(stats.songs[k].semifinals==null)stats.songs[k].semifinals=0;
  if(stats.songs[k].knockoutWins==null)stats.songs[k].knockoutWins=0;
  return stats.songs[k];
}
function recordStatistics(){
  if(state.statsRecorded)return;
  const stats=loadStats();stats.runs=(stats.runs||0)+1;
  const rounds=state.tournament?.rounds||[];
  rounds.forEach(round=>round.matches.forEach(m=>{
    if(m.winner!=null)ensureStat(stats,m.winner).knockoutWins++;
  }));
  const semifinalRound=rounds.find(r=>Number(r.size)===4);
  if(semifinalRound){
    semifinalRound.matches.forEach(m=>{
      if(m.a!=null)ensureStat(stats,m.a).semifinals++;
      if(m.b!=null)ensureStat(stats,m.b).semifinals++;
    });
  }
  const finalRound=rounds.find(r=>Number(r.size)===2) || rounds[rounds.length-1];
  const f=finalRound?.matches?.[0];
  if(f){
    if(f.a!=null)ensureStat(stats,f.a).finals++;
    if(f.b!=null)ensureStat(stats,f.b).finals++;
  }
  if(state.champion!=null)ensureStat(stats,state.champion).championships++;
  localStorage.setItem(CONFIG.statsKey,JSON.stringify(stats));
  state.statsRecorded=true;
}
function finishTournament(championId){
  state.stage="winner";
  state.champion=championId;
  state.completedAt=new Date().toISOString();
  state.supabaseRecorded=false;
  recordStatistics(); // local backup only
  save();
  submitSupabaseResult();
}

function svgEscape(v){
  return escapeHtml(v);
}

function bracketRounds(){
  return state.tournament?.rounds || [];
}

function matchWinner(roundIndex, matchIndex){
  return bracketRounds()[roundIndex]?.matches?.[matchIndex]?.winner ?? null;
}

function sameId(a,b){
  return a!=null && b!=null && String(a)===String(b);
}


function splitTitleLines(title,maxChars=14,maxLines=3){
  const text=String(title||"").trim();
  if(!text) return [""];
  if(text.length<=maxChars) return [text];

  const lines=[];
  if(/\s/.test(text)){
    const words=text.split(/\s+/);
    let cur="";
    for(const word of words){
      const next=cur ? `${cur} ${word}` : word;
      if(next.length<=maxChars || !cur){
        cur=next;
      }else{
        lines.push(cur);
        cur=word;
      }
    }
    if(cur) lines.push(cur);
  }else{
    for(let i=0;i<text.length;i+=maxChars){
      lines.push(text.slice(i,i+maxChars));
    }
  }

  if(lines.length>maxLines){
    const kept=lines.slice(0,maxLines);
    kept[maxLines-1]=kept[maxLines-1].slice(0,Math.max(1,maxChars-1))+"…";
    return kept;
  }
  return lines;
}

async function downloadBracketPNG(){
  const svg=document.getElementById("resultBracketSvg");
  if(!svg){
    alert("저장할 대진표가 없습니다.");
    return;
  }

  try{
    const clone=svg.cloneNode(true);

    // Embed all jacket images as data URLs so canvas export keeps them.
    const images=[...clone.querySelectorAll("image")];
    for(const image of images){
      const href=image.getAttribute("href") || image.getAttributeNS("http://www.w3.org/1999/xlink","href");
      if(!href || href.startsWith("data:")) continue;
      try{
        const response=await fetch(href);
        const blob=await response.blob();
        const dataUrl=await new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onload=()=>resolve(reader.result);
          reader.onerror=reject;
          reader.readAsDataURL(blob);
        });
        image.setAttribute("href",dataUrl);
      }catch(e){
        console.warn("Could not embed image:",href,e);
      }
    }

    // Critical fix: styles used by the live page are outside the SVG.
    // Put the bracket CSS INSIDE the SVG before rasterizing.
    const style=document.createElementNS("http://www.w3.org/2000/svg","style");
    style.textContent=`
      .mc-path{fill:none;stroke:#4b5162;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .mc-path.win{stroke:#e2a0ff;stroke-width:8;filter:url(#winnerGlow)}
      .mc-path.final-win{stroke:#f0b2ff;stroke-width:11;filter:url(#winnerGlow)}
            .mc-path.final-win{stroke:#f0b2ff;stroke-width:11;filter:url(#winnerGlow)}
      .mc-entry{fill:#171923;stroke:#51586a;stroke-width:2}
      .mc-entry-title{fill:#f2f3f8;font-weight:800;font-size:14px;dominant-baseline:middle}
      .mc-round-label{fill:#8990a3;font-size:13px;font-weight:900;text-anchor:middle}
      .mc-champ-box{fill:#171923;stroke:#cf72ff;stroke-width:3;filter:url(#softGlow)}
      .mc-champ-title{fill:#fff;font-size:27px;font-weight:950;text-anchor:middle}
      .mc-champ-sub{fill:#e1a0ff;font-size:28px;font-weight:950;text-anchor:middle}
    `;
    clone.insertBefore(style,clone.firstChild);

    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    clone.setAttribute("xmlns:xlink","http://www.w3.org/1999/xlink");

    const vb=svg.viewBox.baseVal;
    const width=vb?.width || 1200;
    const height=vb?.height || 1700;
    const scale=2;

    const source=new XMLSerializer().serializeToString(clone);
    const svgBlob=new Blob([source],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(svgBlob);
    const raster=new Image();

    raster.onload=()=>{
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(width*scale);
      canvas.height=Math.round(height*scale);
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#090b12";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.scale(scale,scale);
      ctx.drawImage(raster,0,0,width,height);
      URL.revokeObjectURL(url);

      canvas.toBlob(blob=>{
        if(!blob){
          alert("PNG 생성에 실패했습니다.");
          return;
        }
        const downloadUrl=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=downloadUrl;
        a.download=`roselia_bracket_${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(downloadUrl),1500);
      },"image/png");
    };

    raster.onerror=()=>{
      URL.revokeObjectURL(url);
      alert("대진표 이미지 렌더링에 실패했습니다.");
    };

    raster.src=url;
  }catch(e){
    console.error(e);
    alert("대진표 이미지를 저장하지 못했습니다.");
  }
}

function buildSvgBracket(){
  const t=state.tournament;
  const rounds=bracketRounds();
  if(!t || rounds.length<1) return "";

  const entrants=t.seeded || [];
  const n=entrants.length;
  const half=Math.ceil(n/2);

  const W=1200;
  const H=1760;
  const centerX=W/2;
  const centerY=H/2;

  const topEntrants=entrants.slice(0,half);
  const bottomEntrants=entrants.slice(half);

  const thumb=78;
  const cardW=128;
  const cardH=138;
  const sidePad=24;
  const gap=(W-sidePad*2-cardW*8)/7;

  const topCardY=86;
  const bottomCardY=H-86-cardH;

  const topCenters=topEntrants.map((_,i)=>sidePad+cardW/2+i*(cardW+gap));
  const bottomCenters=bottomEntrants.map((_,i)=>sidePad+cardW/2+i*(cardW+gap));

  const topLevels=[280,440,600];
  const bottomLevels=[H-280,H-440,H-600];

  const champW=390;
  const champH=350;
  const champX=centerX-champW/2;
  const champY=centerY-champH/2;

  const basePaths=[];
  const winPaths=[];
  const finalBasePaths=[];
  const finalWinPaths=[];
  const cards=[];
  let topFinalistNode=null;
  let bottomFinalistNode=null;

  function pathD(d,win=false){
    (win?winPaths:basePaths).push(d);
  }

  function cardAt(cx,y,id){
    const s=songById(id);
    const lines=splitTitleLines(s?.title||"",12,3);
    const img=webImagePath(s?.image);
    const x=cx-cardW/2;
    const imgX=cx-thumb/2;
    const imgY=y+10;
    const textY=imgY+thumb+18;
    const tspans=lines.map((ln,i)=>`<tspan x="${cx}" dy="${i===0?0:15}">${svgEscape(ln)}</tspan>`).join("");
    return `
      <g>
        <rect class="mc-entry" x="${x}" y="${y}" width="${cardW}" height="${cardH}" rx="12"/>
        ${img?`<image href="${svgEscape(img)}" x="${imgX}" y="${imgY}" width="${thumb}" height="${thumb}" preserveAspectRatio="xMidYMid slice"/>`:""}
        <text class="mc-entry-title" x="${cx}" y="${textY}" text-anchor="middle">${tspans}</text>
      </g>`;
  }

  topEntrants.forEach((id,i)=>cards.push(cardAt(topCenters[i],topCardY,id)));
  bottomEntrants.forEach((id,i)=>cards.push(cardAt(bottomCenters[i],bottomCardY,id)));

  function drawHalf(ids,centers,isTop){
    const levels=isTop?topLevels:bottomLevels;
    const firstRoundOffset=isTop?0:4;
    const secondRoundOffset=isTop?0:2;
    const thirdRoundOffset=isTop?0:1;
    const cardEdgeY=isTop?topCardY+cardH:bottomCardY;

    let nodes=ids.map((id,i)=>({id,x:centers[i],y:cardEdgeY}));

    for(let stage=0;stage<3;stage++){
      const parentY=levels[stage];
      const next=[];

      for(let j=0;j<nodes.length;j+=2){
        const a=nodes[j];
        const b=nodes[j+1];
        if(!b) continue;

        const parentX=(a.x+b.x)/2;

        let matchIndex;
        if(stage===0) matchIndex=firstRoundOffset+Math.floor(j/2);
        else if(stage===1) matchIndex=secondRoundOffset+Math.floor(j/2);
        else matchIndex=thirdRoundOffset;

        const m=rounds[stage]?.matches?.[matchIndex];
        const winner=m?.winner ?? null;

        const aPath=`M ${a.x} ${a.y} V ${parentY} H ${parentX}`;
        const bPath=`M ${b.x} ${b.y} V ${parentY} H ${parentX}`;

        pathD(aPath,false);
        pathD(bPath,false);

        if(sameId(a.id,winner)) pathD(aPath,true);
        if(sameId(b.id,winner)) pathD(bPath,true);

        next.push({id:winner,x:parentX,y:parentY});
      }

      nodes=next;
    }

    if(nodes.length===1){
      if(isTop) topFinalistNode=nodes[0];
      else bottomFinalistNode=nodes[0];
    }
  }

  drawHalf(topEntrants,topCenters,true);
  drawHalf(bottomEntrants,bottomCenters,false);

  const finalMatch=rounds[rounds.length-1]?.matches?.[0];

  // Read the two semifinal winners directly from the fixed bracket.
  const topSemiWinner = rounds[2]?.matches?.[0]?.winner ?? null;
  const bottomSemiWinner = rounds[2]?.matches?.[1]?.winner ?? null;

  const topWinsFinal = sameId(topSemiWinner, state.champion);
  const bottomWinsFinal = sameId(bottomSemiWinner, state.champion);

  if(topFinalistNode){
    const d=`M ${topFinalistNode.x} ${topFinalistNode.y} V ${champY-28} H ${centerX} V ${champY}`;
    finalBasePaths.push(d);
    if(topWinsFinal) finalWinPaths.push(d);
  }

  if(bottomFinalistNode){
    const d=`M ${bottomFinalistNode.x} ${bottomFinalistNode.y} V ${champY+champH+28} H ${centerX} V ${champY+champH}`;
    finalBasePaths.push(d);
    if(bottomWinsFinal) finalWinPaths.push(d);
  }

  const champ=songById(state.champion);
  const champImg=webImagePath(champ?.image);

  const basePathMarkup=basePaths.map(d=>`<path class="mc-path" d="${d}"/>`).join("");
  const winPathMarkup=winPaths.map(d=>`<path class="mc-path win" d="${d}"/>`).join("");
  const finalBaseMarkup=finalBasePaths.map(d=>`<path class="mc-path final-path" d="${d}"/>`).join("");
  const finalWinMarkup="";

  return `
    <section class="mc-bracket-panel">
      <div class="mc-svg-wrap">
        <svg id="resultBracketSvg" class="mc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="결선 대진표">
          <defs>
            <filter id="winnerGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="6" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="champClip">
              <rect x="${champX+101}" y="${champY+88}" width="188" height="188" rx="24"/>
            </clipPath>
            <radialGradient id="bgGlow" cx="50%" cy="50%" r="72%">
              <stop offset="0%" stop-color="#16142d"/>
              <stop offset="55%" stop-color="#0e1019"/>
              <stop offset="100%" stop-color="#090b12"/>
            </radialGradient>
          </defs>

          <style>
            .mc-path{fill:none;stroke:#4b5162;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
            .mc-path.win{stroke:#e2a0ff;stroke-width:8;filter:url(#winnerGlow)}
            .mc-entry{fill:#171923;stroke:#51586a;stroke-width:2}
            .mc-entry-title{fill:#f2f3f8;font-weight:800;font-size:14px;dominant-baseline:middle}
            .mc-round-label{fill:#8990a3;font-size:13px;font-weight:900;text-anchor:middle}
            .mc-champ-box{fill:#171923;stroke:#cf72ff;stroke-width:3;filter:url(#softGlow)}
            .mc-champ-title{fill:#fff;font-size:27px;font-weight:950;text-anchor:middle}
            .mc-champ-sub{fill:#e1a0ff;font-size:28px;font-weight:950;text-anchor:middle}
          </style>

          <rect x="0" y="0" width="${W}" height="${H}" fill="url(#bgGlow)"/>
          <text x="${centerX}" y="46" text-anchor="middle" style="fill:#fff;font-size:31px;font-weight:950">Roselia · 결선 대진표</text>

          <text class="mc-round-label" x="60" y="266">16강</text>
          <text class="mc-round-label" x="60" y="426">8강</text>
          <text class="mc-round-label" x="60" y="586">4강</text>
          <text class="mc-round-label" x="60" y="${H-266}">16강</text>
          <text class="mc-round-label" x="60" y="${H-426}">8강</text>
          <text class="mc-round-label" x="60" y="${H-586}">4강</text>

          ${basePathMarkup}

          ${cards.join("")}

          <text x="${centerX}" y="${champY-28}" text-anchor="middle" style="fill:#e2a0ff;font-size:20px;font-weight:950">결승</text>
          ${topWinsFinal && topFinalistNode ? `
            <path
              d="M ${topFinalistNode.x} ${topFinalistNode.y} V ${champY-28} H ${centerX} V ${champY+4}"
              fill="none"
              stroke="#d88fff"
              stroke-opacity="0.24"
              stroke-width="18"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M ${topFinalistNode.x} ${topFinalistNode.y} V ${champY-28} H ${centerX} V ${champY+4}"
              fill="none"
              stroke="#e2a0ff"
              stroke-width="10"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          ` : ""}

          ${bottomWinsFinal && bottomFinalistNode ? `
            <path
              d="M ${bottomFinalistNode.x} ${bottomFinalistNode.y} V ${champY+champH+28} H ${centerX} V ${champY+champH-4}"
              fill="none"
              stroke="#d88fff"
              stroke-opacity="0.24"
              stroke-width="18"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M ${bottomFinalistNode.x} ${bottomFinalistNode.y} V ${champY+champH+28} H ${centerX} V ${champY+champH-4}"
              fill="none"
              stroke="#e2a0ff"
              stroke-width="10"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          ` : ""}

          <rect class="mc-champ-box" x="${champX}" y="${champY}" width="${champW}" height="${champH}" rx="30"/>
          <text class="mc-champ-sub" x="${centerX}" y="${champY+52}">🏆 CHAMPION</text>
          ${champImg?`<image href="${svgEscape(champImg)}" x="${champX+101}" y="${champY+88}" width="188" height="188" preserveAspectRatio="xMidYMid slice" clip-path="url(#champClip)"/>`:""}
          <text class="mc-champ-title" x="${centerX}" y="${champY+318}">${svgEscape(champ?.title||"")}</text>

        </svg>
      </div>
      <div class="mc-export-note">대진표 PNG 저장 버튼으로 공유용 이미지를 저장할 수 있습니다.</div>
    </section>`;
}

function renderWinner(){
  if(state?.stage==="winner" && !state.supabaseRecorded){
    submitSupabaseResult();
  }
  const s=songById(state.champion);
  stageLabel.textContent="우승";
  statusText.textContent="대회 완료";

  let bracketMarkup="";
  try{
    bracketMarkup=buildSvgBracket();
  }catch(err){
    console.error("Result bracket render failed:",err);
    bracketMarkup=`<section class="panel"><h2>대진표 표시 오류</h2><p>${escapeHtml(err.message||String(err))}</p></section>`;
  }

  main.innerHTML=`
    <section class="panel winner">
      <div class="image-wrap" style="max-width:320px;margin:0 auto;border-radius:22px">${imgTag(s)}</div>
      <h2>${escapeHtml(s.title)}</h2>
      <div class="artist">${escapeHtml(s.artist||"Roselia")}</div>
      <div class="action-row">
        <button class="btn primary" id="againBtn">새 대회 시작</button>
        <button class="btn" id="saveBracketBtn">대진표 PNG 저장</button>
        <button class="btn" id="statsBtn">통계 보기</button>
      </div>
    </section>
    ${bracketMarkup}
  `;
  $("#againBtn").addEventListener("click",()=>{clearSave();initializeNew();});
  $("#saveBracketBtn")?.addEventListener("click", downloadBracketPNG);
  $("#statsBtn")?.addEventListener("click", renderStatistics);
}

/* ---------- CONTROLS / BOOT ---------- */
$("#undoBtn").addEventListener("click",undo);
$("#resetBtn").addEventListener("click",()=>{
  if(confirm("현재 진행 상황을 지우고 처음부터 다시 시작할까요?")){
    clearSave();initializeNew();
  }
});
async function boot(){
  try{
    const res=await fetch(CONFIG.songsUrl,{cache:"no-store"});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    songs=await res.json();
    if(!Array.isArray(songs))throw new Error("songs.json must be an array");

    try{
      state=JSON.parse(localStorage.getItem(CONFIG.storageKey)||"null");
      undoStack=JSON.parse(localStorage.getItem(CONFIG.historyKey)||"[]");
      if(!Array.isArray(undoStack))undoStack=[];
    }catch(e){state=null;undoStack=[];}
    render();
  }catch(err){
    stageLabel.textContent="songs.json 로드 실패";
    statusText.textContent=err.message;
    main.innerHTML=`<section class="panel"><h2>데이터를 읽지 못했습니다.</h2>
      <p>index.html과 같은 위치에 <b>songs.json</b>이 있는지 확인하세요.</p></section>`;
  }
}
boot();
</script>
</body>
</html>
